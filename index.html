<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Awizacja · INTER-BOX</title>
<style>
:root{
  --bg:#f5f4f0; --paper:#ffffff; --ink:#151514; --ink2:#3e3d39; --muted:#7c7a74; --faint:#b9b6ae;
  --line:#d8d5cd; --line2:#ebe8e2; --accent:#ff5a1f; --accent-soft:#fff1ea; --accent-ink:#c2400f;
  --odbior:#1d1d1b; --zaj:#e7e4dd; --err:#b8261b; --ok:#1d7a3e; --h:30px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h2{font-size:20px;letter-spacing:-.01em;margin:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lnk{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;color:inherit}
.lnk:hover{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:9px 16px;font-weight:600;border-radius:2px;min-height:40px;white-space:nowrap}
.btn:hover{background:#000}
.btn.akc{background:var(--accent);border-color:var(--accent)}
.btn.akc:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.jasny{background:transparent;color:var(--ink)}
.btn.jasny:hover{background:var(--ink);color:#fff}
.btn.zly{background:transparent;color:var(--err);border-color:var(--err)}
.btn.zly:hover{background:var(--err);color:#fff}
.btn.maly{min-height:32px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.pelny{width:100%}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:2px;padding:8px 10px;min-height:40px}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-2px;border-color:var(--accent)}
input:disabled,select:disabled,textarea:disabled{background:#f3f2ee;color:var(--ink2)}
input[type=checkbox]{width:auto;min-height:0;accent-color:var(--accent);margin:0}
.pole{display:block;margin:0 0 14px}
.pole>span,.et{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.rzad2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--ink);border-radius:2px;overflow:hidden;background:#fff}
.seg button{flex:1 1 auto;background:#fff;border:0;border-left:1px solid var(--ink);padding:7px 12px;font-weight:600;min-height:38px}
.seg button:first-child{border-left:0}
.seg button.akt{background:var(--ink);color:#fff}
.seg button:disabled{color:var(--faint);background:#f6f5f2;cursor:not-allowed}
.seg.kafle{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border:0;background:none;overflow:visible}
.seg.kafle button{border:1px solid var(--ink);border-radius:2px}
.komunikat{padding:10px 12px;border-left:3px solid var(--err);background:#fbefed;color:#6f1710;margin:0 0 14px;font-size:13px}
.komunikat.info{border-color:var(--ink);background:#f1f0ec;color:var(--ink2)}
.komunikat.ok{border-color:var(--ok);background:#edf6f0;color:#14512a}
.drobne{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--accent);color:var(--accent);vertical-align:3px;margin-left:8px}

/* ---------- logowanie ---------- */
.logowanie{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.log-lewa{background:var(--ink);color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.log-lewa .eyebrow{color:rgba(255,255,255,.55)}
.log-lewa h1{font-size:76px;line-height:.92;letter-spacing:-.035em;margin:14px 0 18px;font-weight:800}
.log-lewa .lead{font-size:17px;max-width:30ch;color:rgba(255,255,255,.75);margin:0}
.mozaika{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;max-width:360px}
.mozaika i{display:block;height:16px;border:1px solid rgba(255,255,255,.16)}
.mozaika i.o{background:var(--accent);border-color:var(--accent)}
.mozaika i.x{background:rgba(255,255,255,.88);border-color:transparent}
.log-prawa{padding:48px 56px;display:flex;align-items:center}
.log-form{width:100%;max-width:380px}
.log-form h2{font-size:28px;margin-bottom:22px}
.tryb{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2)}
.tryb p{margin:0 0 10px}
.demo-konta{width:100%;border-collapse:collapse;margin:8px 0 12px}
.demo-konta td{padding:6px 0;border-bottom:1px solid var(--line2)}
.demo-konta button{background:none;border:0;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.linki{display:flex;flex-wrap:wrap;gap:6px 16px}
#panelPolacz,#panelAdmin{margin-top:14px;padding:14px;border:1px solid var(--line);background:#fff}

/* ---------- powłoka ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 28px 0}
.marka{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.marka small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:7px}
.kto{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.stan{font-size:12px;color:var(--muted);white-space:nowrap}
.stan i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:1px}
.stan.zywo i{background:var(--ok)} .stan.blad i{background:var(--err)} .stan.demo i{background:var(--accent)}
.zakladki{display:flex;gap:28px;padding:0 28px;border-bottom:1px solid var(--line);margin-top:18px;overflow-x:auto}
.zakladki button{background:none;border:0;padding:12px 0 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap;margin-bottom:-1px}
.zakladki button:hover{color:var(--ink)}
.zakladki button.akt{color:var(--ink);border-color:var(--accent)}
main{padding:22px 28px 70px}
.stopka{padding:0 28px 30px;font-size:12px;color:var(--faint)}

/* ---------- pasek tygodnia ---------- */
.pasek{display:flex;align-items:flex-end;gap:14px 22px;flex-wrap:wrap;margin-bottom:12px}
.tyg{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1}
.tyg small{display:block;font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:6px}
.nav{display:flex}
.nav button{background:#fff;border:1px solid var(--ink);min-width:40px;height:36px;padding:0 12px;font-weight:600;margin-left:-1px}
.nav button:first-child{margin-left:0}
.nav button:hover{background:var(--ink);color:#fff}
.legenda{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-left:auto}
.legenda span{white-space:nowrap}
.legenda i{display:inline-block;width:16px;height:12px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
.legenda i.l-wolne{background:#fff}
.legenda i.l-dostawa{background:var(--accent);border-color:var(--accent)}
.legenda i.l-odbior{background:var(--odbior);border-color:var(--odbior)}
.legenda i.l-zaj{background:var(--zaj);background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(0,0,0,.08) 4px 5px)}
.legenda i.l-niedost{background:#f0eee9}
.podpowiedz{margin:0 0 14px;color:var(--ink2);font-size:13px}

/* ---------- siatka kafelków ---------- */
.siatka{display:grid;grid-template-columns:54px repeat(var(--n),minmax(0,1fr));background:var(--paper);border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.kol{position:relative;border-left:1px solid var(--line);min-width:0}
.kol.czasy{border-left:0}
.nag{position:sticky;top:0;z-index:6;background:var(--paper);height:72px;padding:6px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;overflow:hidden;white-space:nowrap}
.nag span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.nag b{font-size:21px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.nag small{font-size:11px;color:var(--muted)}
.nag.dzis{box-shadow:inset 0 -3px 0 var(--accent)}
.nag.dzis b{color:var(--accent)}
.cialo{position:relative;height:calc(var(--h) * var(--wiersze))}
.et-cz{position:absolute;right:9px;margin-top:8px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;line-height:1}
.et-cz.pelna{color:var(--ink2);font-weight:600}
.kaf{position:absolute;left:3px;right:3px;height:calc(var(--h) - 3px);margin-top:1px;border:1px solid var(--line2);background:#fff;border-radius:2px;padding:0 8px;font-size:12px;font-weight:600;color:transparent;text-align:left;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.kaf.wolne:hover,.kaf.wolne:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.kaf.wolne:hover::after,.kaf.wolne:focus-visible::after{content:'+ ' attr(data-g)}
.kaf.wyb{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.kaf.wyb::after{content:none!important}
.kaf.minione,.kaf.zapozno{background:#f3f2ee;border-color:transparent;cursor:not-allowed}
.kaf.poza,.kaf.swieto{background:#f3f2ee repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.04) 6px 7px);border-color:transparent;cursor:not-allowed}
.kaf.pod{visibility:hidden}
.kol.swieto .cialo{background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(255,90,31,.07) 8px 9px)}
.kol.swieto .kaf.wolne{background:rgba(255,255,255,.7)}
.rez{position:absolute;left:3px;right:3px;margin-top:1px;z-index:2;border-radius:2px;padding:4px 8px;font-size:12px;line-height:1.3;overflow:hidden;color:#fff;background:var(--ink);cursor:pointer;outline:none}
.rez .r1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rez .r2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.82;font-size:11px;font-variant-numeric:tabular-nums}
.rodz{display:inline-block;min-width:1.05em;font-weight:700}
.kolor-firmy{display:inline-block;width:11px;height:11px;margin-right:7px;vertical-align:-1px;border-radius:2px}
.rez:hover,.rez:focus-visible{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--ink)}
.rez.obce{background:var(--zaj) repeating-linear-gradient(135deg,transparent 0 7px,rgba(0,0,0,.05) 7px 8px);color:var(--muted);cursor:default;display:flex;align-items:center}
.rez.obce:hover{box-shadow:none}
.rez.krotka{display:flex;align-items:center;padding-top:0;padding-bottom:0}
.teraz{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--accent);z-index:4;pointer-events:none}
.teraz::before{content:'';position:absolute;left:-1px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.dni-chipy{display:flex;gap:6px;margin:0 0 12px}
.dni-chipy button{flex:1 1 0;min-width:0;background:#fff;border:1px solid var(--line);padding:6px 2px;border-radius:2px;display:flex;flex-direction:column;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dni-chipy button b{font-size:18px;color:var(--ink);letter-spacing:0;line-height:1.2}
.dni-chipy button.dzis b{color:var(--accent)}
.dni-chipy button.akt{border-color:var(--ink);background:var(--ink);color:#fff}
.dni-chipy button.akt b{color:#fff}
.pusto{padding:40px 0;color:var(--muted)}

/* ---------- szuflada ---------- */
.zaslona{position:fixed;inset:0;background:rgba(21,21,20,.28);z-index:50;opacity:0;pointer-events:none;transition:opacity .15s}
.zaslona.otw{opacity:1;pointer-events:auto}
.szuflada{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--paper);z-index:51;border-left:2px solid var(--ink);transform:translateX(102%);transition:transform .18s ease-out;display:flex;flex-direction:column}
.szuflada.otw{transform:none}
.sz-nag{position:relative;padding:20px 56px 16px 24px;border-bottom:1px solid var(--line)}
.sz-czas{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.sz-dzien{color:var(--ink2);margin-top:4px}
.zamknij{position:absolute;top:14px;right:14px;width:36px;height:36px;border:1px solid var(--line);background:#fff;font-size:20px;line-height:1}
.zamknij:hover{border-color:var(--ink)}
.sz-tresc{padding:20px 24px;overflow:auto;flex:1}
.sz-stopka{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;background:var(--paper)}
.meta{font-size:12px;color:var(--muted);border-top:1px solid var(--line2);padding-top:12px;margin-top:4px}
.meta div{margin-bottom:3px}
.odwolanie{border:1px solid var(--err);padding:14px;margin-top:6px}

/* ---------- tabele i sekcje ---------- */
.sekcja{margin-bottom:38px}
.sek-nag{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.przewin{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tab{width:100%;border-collapse:collapse;font-size:13px;background:var(--paper)}
.tab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--ink);white-space:nowrap}
.tab td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.tab td.num,.tab th.num{text-align:right;font-variant-numeric:tabular-nums}
.tab td.nw{white-space:nowrap}
.tab tr.klik{cursor:pointer}
.tab tr.klik:hover td{background:#faf9f6}
.tab tr.odw td{color:var(--faint)}
.tab tr.odw td.st{color:var(--err)}
.tab tr.dzien td{background:var(--bg);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);padding-top:14px}
.tab tr.edycja td{background:#faf9f6}
.kropka{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:0}
.probki{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.probka{width:30px;height:30px;border:0;border-radius:2px;position:relative;padding:0}
.probka.akt{outline:2px solid var(--ink);outline-offset:2px}
.probka.uzyta::after{content:'';position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.probki input[type=color]{width:46px;height:30px;padding:2px;min-height:0;cursor:pointer}
.formularz{background:#fff;border:1px solid var(--ink);padding:18px;margin-bottom:16px}
.formularz .siatka-pol{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 14px}
.siatka-pol{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 16px}
.dni-check{display:flex;flex-wrap:wrap;gap:8px}
.upr{display:flex;flex-direction:column;gap:3px;font-size:12px}
.upr label{display:flex;gap:6px;align-items:center;white-space:nowrap;cursor:pointer}
.dni-check label{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;padding:8px 12px;cursor:pointer}
.chipy{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:4px 4px 4px 10px;font-size:13px}
.chip button{border:0;background:none;width:24px;height:24px;font-size:16px;line-height:1;color:var(--muted)}
.chip button:hover{color:var(--err)}
.akcje{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.wynik{border:2px solid var(--ok);background:#fff;padding:16px;margin-bottom:16px}
.wynik pre{background:var(--bg);padding:10px 12px;margin:10px 0;font:13px/1.6 Consolas,"Courier New",monospace;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;z-index:90;font-size:13px;max-width:calc(100% - 32px);border-left:4px solid var(--ok)}
.toast.blad{border-left-color:var(--err)}

@media (max-width:760px){
  .logowanie{grid-template-columns:1fr}
  .log-lewa{padding:28px 16px 24px;gap:22px}
  .log-lewa h1{font-size:46px;margin:8px 0 10px}
  .log-lewa .lead{font-size:15px}
  .mozaika{display:none}
  .log-prawa{padding:24px 16px 40px}
  .top{padding:14px 16px 0}
  .marka{font-size:24px}
  .kto{gap:6px 16px}
  .kto>span:first-child{flex-basis:100%}
  .et-cz{margin-top:13px}
  .zakladki{padding:0 16px;gap:20px;margin-top:12px}
  main{padding:16px 16px 60px}
  .stopka{padding:0 16px 24px}
  .tyg{font-size:28px}
  .legenda{margin-left:0}
  .rzad2{grid-template-columns:1fr}
  .siatka{grid-template-columns:48px repeat(var(--n),minmax(0,1fr))}
  .sz-czas{font-size:28px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   AWIZACJA v1 — rezerwacja okien czasowych na rampie
   Bez Supabase działa w trybie DEMO (dane tylko w tej przeglądarce).
   Żeby podłączyć prawdziwą bazę, wpisz adres i klucz anon poniżej
   (albo na ekranie logowania: „Połącz z Supabase…”).
   ===================================================================== */
const KONFIG = {
  supabaseUrl:   'https://stmmmoyfbsvldhrndbyc.supabase.co',
  supabaseKlucz: 'sb_publishable_ttqHFipUCztUzqDCXcimBg_BQOhw3pQ',   // klucz publiczny (publishable) — NIGDY „secret” / „service_role”
  domena:  'inter-box.pl',   // techniczny adres konta: awizacja+LOGIN@inter-box.pl
  prefiks: 'awizacja+',
  supabaseJs: 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0'
};
const WERSJA = 'v1.3';

/* ---------- drobiazgi ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const hhmm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const dzienStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const dodajDni = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const poniedzialek = d => { const x = dzienStart(d); return dodajDni(x, -((x.getDay() + 6) % 7)); };
const isoDzien = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const zIso = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const minutyDnia = t => t.getHours() * 60 + t.getMinutes();
const naDzien = (dz, min) => new Date(dz.getFullYear(), dz.getMonth(), dz.getDate(), 0, min);
const isoDow = d => ((d.getDay() + 6) % 7) + 1;
const DNI = ['pon', 'wt', 'śr', 'czw', 'pt', 'sob', 'nd'];
const DNI_PELNE = ['poniedziałek', 'wtorek', 'środa', 'czwartek', 'piątek', 'sobota', 'niedziela'];
const MIES = ['stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca', 'lipca', 'sierpnia', 'września', 'października', 'listopada', 'grudnia'];
const fmtGodz = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const fmtData = d => d.getDate() + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear();
const fmtKrotko = d => DNI[isoDow(d) - 1] + ' ' + d.getDate() + '.' + pad(d.getMonth() + 1);
const fmtDlugo = d => DNI_PELNE[isoDow(d) - 1] + ', ' + d.getDate() + ' ' + MIES[d.getMonth()];
const fmtKiedy = s => { if (!s) return ''; const d = new Date(s); return fmtData(d) + ' ' + fmtGodz(d); };
const fmtDl = min => min < 60 ? min + ' min' : (min / 60).toString().replace('.', ',') + ' h';

function luminancja(hex) {

  const k = [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));

/* ---------- święta ustawowe ---------- */
function wielkanoc(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mies = Math.floor((h + l - 7 * m + 114) / 31), dz = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mies - 1, dz);
}
function swieta(y) {
  const w = wielkanoc(y);
  return [[0, 1], [0, 6], [4, 1], [4, 3], [7, 15], [10, 1], [10, 11], [11, 24], [11, 25], [11, 26]]
    .map(([m, d]) => new Date(y, m, d)).concat([dodajDni(w, 1), dodajDni(w, 60)]).map(isoDzien).sort();
}

/* ---------- zasady rezerwacji (te same co w bazie) ---------- */
function walidujCzas(a, rola, ust, rampy, teraz = new Date()) {
  const p = new Date(a.poczatek), k = new Date(a.koniec);
  if (!(k > p)) return 'Koniec musi być po początku.';
  const r = rampy.find(r => r.id === a.rampa_id);
  if (!r || !r.aktywna) return 'Ta rampa jest nieaktywna.';
  if (rola !== 'przewoznik') return null;
  if (p < new Date(teraz.getTime() + ust.min_wyprzedzenie * 60000)) return `Rezerwacja jest możliwa najpóźniej ${ust.min_wyprzedzenie} min przed oknem.`;
  const dz = dzienStart(p);
  if (dz > dodajDni(dzienStart(teraz), ust.dni_naprzod)) return `Można rezerwować najwyżej ${ust.dni_naprzod} dni naprzód.`;
  if (!ust.dni_robocze.includes(isoDow(dz)) || ust.dni_wolne.includes(isoDzien(dz))) return 'Ten dzień jest wolny – rampa nie przyjmuje aut.';
  const m0 = minutyDnia(p);
  const m1 = isoDzien(k) === isoDzien(p) ? minutyDnia(k) : (isoDzien(k) === isoDzien(dodajDni(dz, 1)) && minutyDnia(k) === 0 ? 1440 : 99999);
  if (p.getSeconds() || m0 < ust.od_min || m1 > ust.do_min) return `Rampa przyjmuje auta od ${hhmm(ust.od_min)} do ${hhmm(ust.do_min)}.`;
  if ((m0 - ust.od_min) % ust.okno_min || (m1 - m0) % ust.okno_min) return `Rezerwacja musi zaczynać się i kończyć na granicy okna (${ust.okno_min} min).`;
  if (m1 - m0 > ust.max_okien * ust.okno_min) return `Jedna rezerwacja może trwać najwyżej ${ust.max_okien * ust.okno_min} min.`;
  return null;
}

function wczytajSkrypt(src) {

function bladSb(e) {

  if (e.code === '23505') return new Error('Taki wpis już istnieje (powtórzony login, kod albo adres).');
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return new Error('Brak połączenia z bazą. Sprawdź internet i spróbuj ponownie.');
  return new Error(m);
}
function bladAuth(e, email) {
  const m = (e && e.message) || String(e);
  if (/Invalid login credentials/i.test(m)) return new Error('Zły login lub hasło.');
  if (/Email not confirmed/i.test(m)) return new Error('Konto czeka na potwierdzenie e-mail. W Supabase wyłącz „Confirm email” (Authentication → Sign In / Providers → Email).');
  if (/already registered|already been registered|already exists/i.test(m)) return new Error('Taki login już istnieje.');
  if (/Signups not allowed|signup.*disabled/i.test(m)) return new Error('W Supabase wyłączone jest zakładanie kont. Włącz „Allow new users to sign up” (Authentication → Sign In / Providers).');
  if (/Database error saving new user/i.test(m)) return new Error('Baza nie przyjęła konta – nie zostało przygotowane w programie (albo minął termin). Dla admina: uruchom ponownie awizacja-baza.sql.');
  if (/email/i.test(m) && /invalid/i.test(m)) return new Error('Supabase odrzucił techniczny adres konta (' + (email || '') + '). Zmień KONFIG.domena w pliku programu.');

  if (/rate limit|too many/i.test(m)) return new Error('Za dużo prób – odczekaj kilka minut.');

  if (a.status === 'odwolana') return S.ja.rola === 'logistyka' ? 'Awizacja jest odwołana. Możesz ją przywrócić, jeśli okno jest wolne.' : 'Awizacja jest odwołana. Żeby przyjechać, zarezerwuj nowe okno.';
  if (S.ja.rola === 'przewoznik' && new Date(a.poczatek) < new Date(Date.now() + S.ust.odwolanie_min * 60000))
    return `Zmiany i odwołanie są możliwe najpóźniej ${S.ust.odwolanie_min} min przed oknem. W razie potrzeby zadzwoń do logistyki.`;

}

  const opcje = [];

    opcje.push(`<option value="${m}"${m === e.start ? ' selected' : ''}${ok || m === e.start ? '' : ' disabled'}>${hhmm(m)}${ok ? '' : ' – niedostępne'}</option>`);

  for (let kk = 1; kk <= limit; kk++) dl.push(`<button type="button" data-dl="${kk}" class="${kk === e.dl ? 'akt' : ''}"${(kk > mx && kk !== e.dl) || zablokuj ? ' disabled' : ''}>${fmtDl(kk * u.okno_min)}</button>`);
  const dzis = dzienStart(new Date());

  const maxD = log ? '' : isoDzien(dodajDni(dzis, u.dni_naprzod));
  const f = e.pola, dis = zablokuj ? ' disabled' : '';
  let ostrzezenie = '';
  if (!zablokuj && !okCzas) ostrzezenie = !dzienRoboczy ? 'Ten dzień jest wolny – rampa nie przyjmuje aut. Wybierz inny dzień.' : (mx === 0 ? 'Wybrana godzina jest zajęta albo niedostępna. Wybierz inną.' : `Od tej godziny wolne jest tylko ${fmtDl(mx * u.okno_min)}.`);

  const html = `

      <div class="rzad2">

        <div class="akcje"><button type="button" class="btn zly" id="bPotwOdw"${e.zapis ? ' disabled' : ''}>Tak, odwołaj</button><button type="button" class="btn jasny" id="bNieOdw">Nie odwołuj</button></div>

      : ro ? `${odw && log ? `<button type="button" class="btn akc" id="bPrzywroc"${e.zapis ? ' disabled' : ''}>Przywróć awizację</button>` : ''}<button type="button" class="btn jasny" id="bAnuluj">Zamknij</button>`
      : `<button type="submit" form="fAw" class="btn akc"${!okCzas || e.zapis ? ' disabled' : ''}>${e.zapis ? 'Zapisuję…' : 'Zapisz zmiany'}</button>${e.odwolywanie ? '' : '<button type="button" class="btn zly" id="bOdwolaj">Odwołaj awizację</button>'}<button type="button" class="btn jasny" id="bAnuluj">Zamknij</button>`}
    </div>`;
  const sz = $('#szuflada');
  const scroll = $('.sz-tresc', sz) ? $('.sz-tresc', sz).scrollTop : 0;
  otworzSzuflade(html);
  $('.sz-tresc', sz).scrollTop = scroll;

  form.addEventListener('change', ev => {
    const t = ev.target;
    if (t.name === 'dzien') { if (!t.value) return; e.dzien = t.value; e.blad = ''; e.bloki = blokiZTygodnia(e); dopasujDl(e); renderSzAw(); odswiezBlokiFormularza(e); }
    else if (t.name === 'start') { e.start = +t.value; e.blad = ''; dopasujDl(e); renderSzAw(); }
  });
  form.addEventListener('submit', ev => { ev.preventDefault(); zapiszAwizacje(); });
  $$('#segDl button').forEach(b => b.onclick = () => { e.dl = +b.dataset.dl; renderSzAw(); });
  $$('#segRodzaj button').forEach(b => b.onclick = () => { e.pola.rodzaj = b.dataset.r; renderSzAw(); });
  const on = (id, fn) => { const el = $('#' + id); if (el) el.onclick = fn; };
  on('bAnuluj', zamknijSzuflade);

async function zapiszAwizacje() {
  const e = S.ed; if (!e || e.zapis) return;
  const u = S.ust, f = e.pola, log = S.ja.rola === 'logistyka';
  e.blad = '';
  const nr = String(f.nr_rej || '').trim().replace(/\s+/g, ' ').toUpperCase();
  if (!nr) { e.blad = 'Podaj numer rejestracyjny auta.'; return renderSzAw(); }
  if (log && !f.firma_id) { e.blad = 'Wybierz firmę przewoźnika.'; return renderSzAw(); }
  const pal = String(f.palety ?? '').trim();
  if (pal !== '' && !(/^\d+$/.test(pal) && +pal <= 200)) { e.blad = 'Liczba palet: wpisz liczbę od 0 do 200.'; return renderSzAw(); }
  const dz = zIso(e.dzien), p = naDzien(dz, e.start), k = naDzien(dz, e.start + e.dl * u.okno_min);
  const trim = v => { v = String(v ?? '').trim(); return v === '' ? null : v; };
  const rek = {
    rampa_id: e.rampa, poczatek: p.toISOString(), koniec: k.toISOString(), rodzaj: f.rodzaj,
    firma_id: log ? +f.firma_id : S.ja.firma_id, nr_rej: nr, kierowca: trim(f.kierowca), telefon: trim(f.telefon),
    palety: pal === '' ? null : +pal, nr_dokumentu: trim(f.nr_dokumentu), uwagi: trim(f.uwagi)
  };
  const czasZm = e.tryb === 'nowa' || +new Date(e.a.poczatek) !== +p || +new Date(e.a.koniec) !== +k;
  if (czasZm) {
    const b = walidujCzas(rek, S.ja.rola, u, S.rampy); if (b) { e.blad = b; return renderSzAw(); }
    if (maxDlugosc(e, idxSlotu(e.start)) < e.dl) { e.blad = 'Wybrane okno nie jest wolne.'; return renderSzAw(); }
  }
  e.zapis = true; renderSzAw();
  try {
    if (e.tryb === 'nowa') await S.db.dodaj(rek); else await S.db.zmien(e.a.id, rek);
    zamknijSzuflade();
    toast(`${e.tryb === 'nowa' ? 'Zarezerwowano' : 'Zapisano'}: ${fmtKrotko(p)}, ${fmtGodz(p)}–${fmtGodz(k)} · ${nr}`);
    await odswiez(true);
  } catch (err) {
    e.zapis = false; e.blad = err.message;
    if (err.code === '23P01') { await odswiez(true); await odswiezBlokiFormularza(e); }
    if (S.ed === e) renderSzAw();
  }
}
async function odwolajAwizacje() {
  const e = S.ed; if (!e || e.zapis) return;
  e.zapis = true; renderSzAw();
  try {
    await S.db.odwolaj(e.a.id, String(e.pola.powod || '').trim());
    zamknijSzuflade(); toast('Awizacja odwołana – okno jest znowu wolne.');
    await odswiez(true);
  } catch (err) { e.zapis = false; e.blad = err.message; if (S.ed === e) renderSzAw(); }
}
async function przywrocAwizacje() {
  const e = S.ed; if (!e || e.zapis) return;
  e.zapis = true; renderSzAw();
  try {
    await S.db.zmien(e.a.id, { status: 'aktywna' });
    zamknijSzuflade(); toast('Awizacja przywrócona.');
    await odswiez(true);
  } catch (err) { e.zapis = false; e.blad = err.message; if (S.ed === e) renderSzAw(); }
}

function otworzZmianeHasla() {
  S.ed = null; czyscWybor();
  otworzSzuflade(`
    <div class="sz-nag"><div class="eyebrow">Moje konto · ${esc(S.ja.login)}</div><div class="sz-czas">Zmiana hasła</div><button type="button" class="zamknij" aria-label="Zamknij">×</button></div>
    <form class="sz-tresc" id="fHaslo">
      <div id="hBlad"></div>
      <label class="pole"><span>Nowe hasło lub PIN (min. 6 znaków)</span><input type="password" name="h1" autocomplete="new-password"></label>
      <label class="pole"><span>Powtórz</span><input type="password" name="h2" autocomplete="new-password"></label>
      <p class="drobne">Hasło zmieni się od razu. Przy następnym logowaniu użyj nowego.</p>
    </form>
    <div class="sz-stopka"><button type="submit" form="fHaslo" class="btn akc">Zmień hasło</button><button type="button" class="btn jasny" id="bAnulujH">Anuluj</button></div>`);
  $('#bAnulujH').onclick = zamknijSzuflade;
  const f = $('#fHaslo'); f.h1.focus();
  f.addEventListener('submit', async ev => {
    ev.preventDefault();
    const zle = t => { $('#hBlad').innerHTML = `<div class="komunikat">${esc(t)}</div>`; };
    if (f.h1.value.length < 6) return zle('Hasło musi mieć co najmniej 6 znaków.');

    try { await S.db.zmienMojeHaslo(f.h1.value); zamknijSzuflade(); toast('Hasło zmienione.'); } catch (e) { zle(e.message); }
  });
}

function wierszAwizacji(a, zFirma) {
  const p = new Date(a.poczatek), k = new Date(a.koniec), odw = a.status === 'odwolana';
  return `<tr class="klik${odw ? ' odw' : ''}" data-id="${esc(a.id)}">
    <td class="nw">${fmtKrotko(p)}</td><td class="nw">${fmtGodz(p)}–${fmtGodz(k)}</td>
    ${S.rampy.filter(r => r.aktywna).length > 1 ? `<td>${esc(rampa(a.rampa_id).kod)}</td>` : ''}
    <td class="nw"><b>${strzalka(a.rodzaj)}</b> ${nazwaRodzaju(a.rodzaj)}</td>
    ${zFirma ? `<td class="nw"><span class="kolor-firmy" style="background:${kolorFirmy(a.firma_id)}"></span>${esc(nazwaFirmy(a.firma_id))}</td>` : ''}
    <td class="nw"><b>${esc(a.nr_rej)}</b></td><td>${esc(a.kierowca || '')}</td><td class="nw">${esc(a.telefon || '')}</td>

}
function naglowekTabeli(zFirma) {
  return `<tr><th>Dzień</th><th>Godz.</th>${S.rampy.filter(r => r.aktywna).length > 1 ? '<th>Rampa</th>' : ''}<th>Rodzaj</th>${zFirma ? '<th>Firma</th>' : ''}<th>Nr rej.</th><th>Kierowca</th><th>Telefon</th><th class="num">Palety</th><th>Dokument</th><th>Uwagi</th><th>Status</th></tr>`;
}
function renderLista() {
  const w = $('#widok'), dni = dniTygodnia(S.tydzien);
  const lista = S.awz.filter(a => S.pokazOdwolane || a.status === 'aktywna').sort((x, y) => new Date(x.poczatek) - new Date(y.poczatek));
  const kol = 11 + (S.rampy.filter(r => r.aktywna).length > 1 ? 1 : 0);
  let wiersze = '', ost = '';
  for (const a of lista) {
    const d = isoDzien(new Date(a.poczatek));
    if (d !== ost) {
      ost = d; const ile = lista.filter(x => x.status === 'aktywna' && isoDzien(new Date(x.poczatek)) === d).length;
      wiersze += `<tr class="dzien"><td colspan="${kol}">${fmtDlugo(zIso(d))} · ${ile} ${odmianaAut(ile)}</td></tr>`;
    }
    wiersze += wierszAwizacji(a, true);
  }
  const akt = S.awz.filter(a => a.status === 'aktywna');

      <label style="display:flex;gap:7px;align-items:center;margin-left:auto"><input type="checkbox" id="chOdw"${S.pokazOdwolane ? ' checked' : ''}> pokaż odwołane</label>

    toast(await kopiuj(txt) ? `Skopiowano ${lista.length} wierszy – wklej w Excelu (Ctrl+V).` : 'Nie udało się skopiować.', false);
  };
  $$('.tab tr.klik', w).forEach(tr => tr.onclick = () => otworzIstniejaca(tr.dataset.id));
}

function komorkaUprawnien(k) {
  if (k.rola !== 'logistyka') return '<span class="drobne">—</span>';
  const ja = k.id === S.ja.id;
  return `<div class="upr">
    <label title="${ja ? 'Nie możesz odebrać sobie roli administratora' : 'Wszystko, także konta i uprawnienia'}"><input type="checkbox" data-upr="admin" data-k="${esc(k.id)}"${k.admin ? ' checked' : ''}${ja ? ' disabled' : ''}> administrator</label>

}

    ${S.kWynik ? `<div class="wynik"><b>Konto utworzone.</b> Przekaż te dane osobie, która będzie z niego korzystać:

    ${ke ? `<form class="formularz" id="fKonto">

        ${S.hasloDla === k.id ? `<tr class="edycja"><td colspan="7"><form id="fNoweHaslo" class="akcje"><span>Nowe hasło dla <b>${esc(k.login)}</b>:</span><input name="h" style="max-width:220px" autocomplete="off" value="${esc(losujHaslo())}"><button class="btn maly" type="submit">Ustaw</button><button class="btn jasny maly" type="button" id="bAnulujHaslo">Anuluj</button><span id="nhBlad" class="drobne"></span></form></td></tr>` : ''}`).join('')}

    <p class="drobne" style="margin-top:12px">Zablokowane konto nie zaloguje się i nie zobaczy danych. Zablokowanie firmy blokuje wszystkie jej konta. Zmiana uprawnień działa po odświeżeniu strony u tej osoby.</p>
  </section>` : `<p class="drobne">${mam('firmy') ? '' : 'Firmy dodaje i zmienia osoba z uprawnieniem „firmy”. '}Konta użytkowników zakłada administrator.</p>`}`;
  const on = (id, fn) => { const el = $('#' + id); if (el) el.onclick = fn; };
  on('bNowaFirma', () => { S.fe = { aktywna: true, kolor: wolnyKolor(S.firmy) }; renderFirmy(); $('#fFirma').nazwa.focus(); });

  }
  if (ff) ff.addEventListener('submit', async ev => {
    ev.preventDefault();
    const dane = { ...(S.fe.id ? { id: S.fe.id } : {}), nazwa: ff.nazwa.value.trim(), nip: ff.nip.value.trim() || null, telefon: ff.telefon.value.trim() || null, email: ff.email.value.trim() || null, uwagi: ff.uwagi.value.trim() || null, aktywna: ff.aktywna.checked, kolor: String(S.fe.kolor || wolnyKolor(S.firmy, S.fe.id)).toUpperCase() };
    if (!dane.nazwa) { $('#fBlad').innerHTML = '<div class="komunikat">Podaj nazwę firmy.</div>'; return; }
    try { await S.db.zapiszFirme(dane); S.fe = null; S.firmy = await S.db.firmy(); toast('Firma zapisana.'); renderFirmy(); }
    catch (e) { $('#fBlad').innerHTML = `<div class="komunikat">${esc(e.message)}</div>`; }
  });
  on('bNoweKonto', () => { S.ke = { rola: 'przewoznik', firma_id: '', login: '', imie: '', haslo: losujHaslo(), uprawnienia: [] }; S.kWynik = null; renderFirmy(); const f = $('#fKonto'); (f.firma_id || f.login).focus(); });
  on('bAnulujKonto', () => { S.ke = null; renderFirmy(); });
  on('bZamknijWynik', () => { S.kWynik = null; renderFirmy(); });

    $$('[data-kupr]', fk).forEach(c => c.onchange = () => { const u = new Set(S.ke.uprawnienia || []); c.checked ? u.add(c.dataset.kupr) : u.delete(c.dataset.kupr); S.ke.uprawnienia = [...u]; });
    on('bLosuj', () => { S.ke.haslo = losujHaslo(); fk.haslo.value = S.ke.haslo; });
    fk.addEventListener('submit', async ev => {

      k.login = String(k.login || '').trim().toLowerCase();
      if (k.rola === 'przewoznik' && !k.firma_id) return zle('Wybierz firmę.');
      if (!/^[a-z0-9][a-z0-9._-]{1,39}$/.test(k.login) && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(k.login)) return zle('Login: 2–40 znaków – małe litery bez polskich znaków, cyfry, kropka, myślnik, podkreślnik.');

      await S.db.ustawHaslo(k.login, h);

    } else {
      const u = new Set(k.uprawnienia || []); c.checked ? u.add(c.dataset.upr) : u.delete(c.dataset.upr); zm = { uprawnienia: [...u] };
    }
    try { await S.db.zmienKonto(k.id, zm); S.konta = await S.db.konta(); toast(`Uprawnienia ${k.login} zapisane.`); }
    catch (e) { toast(e.message, true); }
    renderFirmy();
  });
  $$('[data-blok]', w).forEach(b => b.onclick = async () => {
    const k = S.konta.find(x => x.id === b.dataset.blok);
    if (k.aktywny && !confirm(`Zablokować konto ${k.login}? Nie będzie mogło się zalogować ani rezerwować.`)) return;
    try { await S.db.zmienKonto(k.id, { aktywny: !k.aktywny }); S.konta = await S.db.konta(); renderFirmy(); toast(k.aktywny ? 'Konto zablokowane.' : 'Konto odblokowane.'); }
    catch (e) { toast(e.message, true); }
  });
}

/* =====================================================================
   USTAWIENIA (logistyka)
   ===================================================================== */
function renderUstawienia() {
  const w = $('#widok');
  if (!S.uste) S.uste = JSON.parse(JSON.stringify(S.ust));
  const u = S.uste, rok = new Date().getFullYear(), dzis = isoDzien(new Date());
  const wolne = [...u.dni_wolne].sort().filter(d => d >= dzis);
  const ukryte = u.dni_wolne.length - wolne.length;
  const zmiany = JSON.stringify(u) !== JSON.stringify(S.ust);
  w.innerHTML = `
  <form id="fUst">
  <section class="sekcja">
    <div class="sek-nag"><h2>Okna czasowe</h2></div>
    <div id="uBlad"></div>
    <div class="siatka-pol">
      <label class="pole"><span>Rampa przyjmuje od</span><input type="time" name="od" step="900" value="${hhmm(u.od_min)}"></label>
      <label class="pole"><span>do</span><input type="time" name="do" step="900" value="${u.do_min >= 1440 ? '00:00' : hhmm(u.do_min)}"></label>
      <label class="pole"><span>Długość jednego okna</span><select name="okno_min">${[15, 20, 30, 60].map(m => `<option value="${m}"${m === u.okno_min ? ' selected' : ''}>${m} min</option>`).join('')}</select></label>
      <label class="pole"><span>Jedna rezerwacja – maks. liczba okien</span><input type="number" name="max_okien" min="1" max="16" value="${u.max_okien}"></label>
      <label class="pole"><span>Rezerwacja najwyżej dni naprzód</span><input type="number" name="dni_naprzod" min="1" max="120" value="${u.dni_naprzod}"></label>
      <label class="pole"><span>Rezerwacja najpóźniej (min przed oknem)</span><input type="number" name="min_wyprzedzenie" min="0" max="10080" value="${u.min_wyprzedzenie}"></label>
      <label class="pole"><span>Zmiana / odwołanie najpóźniej (min przed oknem)</span><input type="number" name="odwolanie_min" min="0" max="10080" value="${u.odwolanie_min}"></label>
    </div>
    <div class="pole"><span class="et">Dni pracy rampy</span><div class="dni-check">${[1, 2, 3, 4, 5, 6, 7].map(d => `<label><input type="checkbox" name="dzien" value="${d}"${u.dni_robocze.includes(d) ? ' checked' : ''}> ${DNI_PELNE[d - 1]}</label>`).join('')}</div></div>
    <p class="drobne">Limity dotyczą przewoźników. Logistyka może wpisać awizację na dowolny dzień, także wolny.</p>
  </section>
  <section class="sekcja">
    <div class="sek-nag"><h2>Dni wolne</h2>
      <div class="akcje"><input type="date" id="nowyWolny" style="width:auto"><button type="button" class="btn jasny maly" id="bDodajWolny">Dodaj dzień</button><button type="button" class="btn jasny maly" id="bSwieta">+ Święta ustawowe ${rok}–${rok + 1}</button></div>
    </div>
    ${wolne.length ? `<div class="chipy">${wolne.map(d => `<span class="chip">${fmtKrotko(zIso(d))}.${d.slice(0, 4)}<button type="button" data-usun="${d}" aria-label="Usuń ${d}">×</button></span>`).join('')}</div>` : '<p class="drobne">Brak dni wolnych w przyszłości.</p>'}
    ${ukryte ? `<p class="drobne">Minione dni wolne: ${ukryte} (ukryte).</p>` : ''}
  </section>
  <div class="akcje sekcja"><button type="submit" class="btn akc" id="bZapiszUst"${zmiany ? '' : ' disabled'}>Zapisz ustawienia</button>${zmiany ? '<button type="button" class="btn jasny" id="bCofnijUst">Cofnij zmiany</button><span class="drobne">Są niezapisane zmiany.</span>' : '<span class="drobne">Wszystko zapisane.</span>'}</div>
  </form>
  <section class="sekcja">
    <div class="sek-nag"><h2>Rampy</h2>${S.nowaRampa ? '' : '<button class="btn maly" id="bNowaRampa">+ Dodaj rampę</button>'}</div>
    <div class="przewin"><table class="tab"><thead><tr><th>Kod</th><th>Nazwa</th><th class="num">Kolejność</th><th>Aktywna</th><th></th></tr></thead><tbody>
      ${S.rampy.concat(S.nowaRampa ? [S.nowaRampa] : []).map((r, i) => `<tr data-r="${i}">
        <td><input name="kod" value="${esc(r.kod)}" style="max-width:90px"></td><td><input name="nazwa" value="${esc(r.nazwa)}"></td>
        <td class="num"><input name="kolejnosc" type="number" value="${r.kolejnosc ?? 1}" style="max-width:80px"></td>
        <td><input type="checkbox" name="aktywna"${r.aktywna ? ' checked' : ''}></td>
        <td class="nw"><button class="btn maly" data-zapr="${i}">Zapisz</button>${r.id ? '' : ' <button class="btn jasny maly" id="bAnulujRampe">Anuluj</button>'}</td></tr>`).join('')}
    </tbody></table></div>
  </section>`;
  const f = $('#fUst');
  const czytajFormularz = () => {
    const doV = f.elements['do'].value;
    const doM = doV ? (doV === '00:00' ? 1440 : +doV.slice(0, 2) * 60 + +doV.slice(3, 5)) : u.do_min;
    const odV = f.od.value;
    Object.assign(u, {
      od_min: odV ? +odV.slice(0, 2) * 60 + +odV.slice(3, 5) : u.od_min, do_min: doM, okno_min: +f.okno_min.value,
      max_okien: +f.max_okien.value || 1, dni_naprzod: +f.dni_naprzod.value || 1,
      min_wyprzedzenie: Math.max(0, +f.min_wyprzedzenie.value || 0), odwolanie_min: Math.max(0, +f.odwolanie_min.value || 0),
      dni_robocze: $$('input[name=dzien]', f).filter(c => c.checked).map(c => +c.value)
    });
  };
  f.addEventListener('change', () => { czytajFormularz(); renderUstawienia(); });
  $('#bDodajWolny').onclick = () => { const v = $('#nowyWolny').value; if (!v) return; czytajFormularz(); if (!u.dni_wolne.includes(v)) u.dni_wolne.push(v); u.dni_wolne.sort(); renderUstawienia(); };
  $('#bSwieta').onclick = () => { czytajFormularz(); u.dni_wolne = [...new Set([...u.dni_wolne, ...swieta(rok), ...swieta(rok + 1)])].sort(); renderUstawienia(); };
  $$('[data-usun]', w).forEach(b => b.onclick = () => { czytajFormularz(); u.dni_wolne = u.dni_wolne.filter(d => d !== b.dataset.usun); renderUstawienia(); });
  const c = $('#bCofnijUst'); if (c) c.onclick = () => { S.uste = null; renderUstawienia(); };
  f.addEventListener('submit', async ev => {
    ev.preventDefault(); czytajFormularz();
    const zle = t => { $('#uBlad').innerHTML = `<div class="komunikat">${esc(t)}</div>`; window.scrollTo({ top: 0 }); };
    if (!(u.od_min < u.do_min)) return zle('Godzina „od” musi być wcześniejsza niż „do”.');
    if ((u.do_min - u.od_min) < u.okno_min) return zle('Między „od” a „do” musi zmieścić się co najmniej jedno okno.');
    if ((u.od_min % u.okno_min) !== 0) return zle(`Godzina „od” powinna pasować do długości okna (${u.okno_min} min), np. ${hhmm(Math.floor(u.od_min / u.okno_min) * u.okno_min)}.`);
    if (!u.dni_robocze.length) return zle('Zaznacz co najmniej jeden dzień pracy.');
    if (u.max_okien < 1 || u.max_okien > 16) return zle('Limit okien na rezerwację: od 1 do 16.');
    try {
      const { id, strefa, ...x } = u;
      await S.db.zapiszUstawienia(x);
      S.uste = null; await wczytajSlowniki(); toast('Ustawienia zapisane.'); renderUstawienia();
    } catch (e) { zle(e.message); }
  });
  const nr = $('#bNowaRampa'); if (nr) nr.onclick = () => { S.nowaRampa = { kod: 'R' + (S.rampy.length + 1), nazwa: 'Rampa ' + (S.rampy.length + 1), kolejnosc: S.rampy.length + 1, aktywna: true }; renderUstawienia(); };
  const ar = $('#bAnulujRampe'); if (ar) ar.onclick = () => { S.nowaRampa = null; renderUstawienia(); };
  $$('[data-zapr]', w).forEach(b => b.onclick = async () => {
    const i = +b.dataset.zapr, tr = b.closest('tr'), r = S.rampy.concat(S.nowaRampa ? [S.nowaRampa] : [])[i];
    const dane = { ...(r.id ? { id: r.id } : {}), kod: $('[name=kod]', tr).value.trim().toUpperCase(), nazwa: $('[name=nazwa]', tr).value.trim(), kolejnosc: +$('[name=kolejnosc]', tr).value || 1, aktywna: $('[name=aktywna]', tr).checked };
    if (!dane.kod || !dane.nazwa) return toast('Podaj kod i nazwę rampy.', true);
    if (r.id && !dane.aktywna && S.rampy.filter(x => x.aktywna && x.id !== r.id).length === 0) return toast('Musi zostać co najmniej jedna aktywna rampa.', true);
    try { await S.db.zapiszRampe(dane); S.nowaRampa = null; await wczytajSlowniki(); toast('Rampa zapisana.'); renderPowloka(); S.widok = 'ustawienia'; $$('#zakladki button').forEach(x => x.classList.toggle('akt', x.dataset.w === 'ustawienia')); renderWidok(); }
    catch (e) { toast(e.message, true); }
  });
}

/* ---------- zdarzenia globalne ---------- */
let szer = czyWaski();
window.addEventListener('resize', () => { const t = czyWaski(); if (t !== szer) { szer = t; if (S.ja && !S.drag) renderWidok(); } });
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !S.ja) return;
  try { await wczytajSlowniki(); } catch (e) {}
  odswiez(true);
});
setInterval(() => { if (S.ja && document.visibilityState === 'visible' && !S.ed) odswiez(true); }, 60000);

window.AWZ = { S, start, odswiez, renderWidok, walidujCzas, swieta, wielkanoc, loginNaEmail, DemoDB, otworzNowa, otworzIstniejaca };
start();
</script>
